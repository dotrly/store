name: Publish Store Apps

on:
  push:
    paths:
      - 'index.json'
      - 'apps/**'
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sanitize Registry
        run: find apps -type f ! -name '*.json' -delete || true

      - name: Build Catalog
        env:
          RELAY_STORE_SIGNING_KEY: ${{ secrets.RELAY_STORE_SIGNING_KEY }}
        run: node .github/scripts/build-catalog.cjs

      - name: Promote Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/bot-publish.mjs

      - name: Commit Catalog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: Rebuild catalog [skip ci]"
          file_pattern: "index.json index.sig"

      - name: Purge jsDelivr Cache
        run: |
          curl -X GET https://purge.jsdelivr.net/gh/dotrly/store@main/index.json || true
          curl -X GET https://purge.jsdelivr.net/gh/dotrly/store@main/index.sig || true
